<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yol Arkadaşım | Arıza Destek</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <h2 class="text-2xl font-bold text-orange-500 mb-4 text-center">🚗 Yol Arkadaşım</h2>
        
        <div class="mb-4">
            <label for="soruKutusu" class="block text-sm font-medium mb-2 text-slate-400">Aracınızdaki sorunu yazın:</label>
            <input type="text" id="soruKutusu" placeholder="Örn: Corsa motor arıza lambası..." 
                   class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 outline-none text-white focus:ring-2 focus:ring-orange-500">
        </div>

        <button id="gonderBtn"
                class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg transition duration-200">
            SORUYU GÖNDER
        </button>

        <div id="cevapAlani" class="mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700 min-h-[100px] text-sm leading-relaxed whitespace-pre-wrap">
            <span class="text-slate-500 italic">Cevap burada görünecek...</span>
        </div>
    </div>

    <script>
        // Buton tıklamasını dinliyoruz
        const btn = document.getElementById('gonderBtn');
        const input = document.getElementById('soruKutusu');
        const output = document.getElementById('cevapAlani');

        btn.addEventListener('click', async () => {
            // ANAHTARINI KONTROL ET
            const API_KEY = "AIzaSyDtAN-lmb4ZGz3XmFEXOBlKBUMXBUS6jWk"; 
            const soru = input.value.trim();

            if (!soru) return;

            output.innerHTML = "<span class='text-orange-400 animate-pulse'>Sistem kararlı sürüme bağlanıyor...</span>";
            btn.disabled = true;
            btn.innerText = "DÜŞÜNÜYOR...";

            try {
                // v1beta yerine doğrudan v1 (kararlı sürüm) adresini kullanıyoruz
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: soru }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    // Eğer yine model hatası verirse, alternatif model (gemini-pro) denenebilir
                    output.innerHTML = `<span class='text-red-500'>Google Yanıtı: ${data.error.message}</span>`;
                } else if (data.candidates && data.candidates[0]) {
                    const aiCevabi = data.candidates[0].content.parts[0].text;
                    output.innerText = aiCevabi;
                    output.className = "mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700 text-white";
                }
            } catch (err) {
                output.innerHTML = `<span class='text-red-500'>Bağlantı Hatası: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "SORUYU GÖNDER";
            }
        });
    </script>
</body>
</html>
