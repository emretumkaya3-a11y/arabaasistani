<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Model Test Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10">
    <div class="max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold text-orange-500 mb-5">Anahtar Yetki Testi</h2>
        <button onclick="modellereBak()" class="bg-blue-600 p-3 rounded mb-5">Hangi Modellerim Aktif? Gör!</button>
        
        <div id="sonucAlani" class="bg-black p-5 rounded border border-slate-700 font-mono text-sm overflow-auto max-h-96">
            Sonuçlar burada görünecek...
        </div>
    </div>

    <script>
        async function modellereBak() {
            const API_KEY = "AIzaSyDtAN-lmb4ZGz3XmFEXOBlKBUMXBUS6jWk"; // Seninki kalsın
            const output = document.getElementById('sonucAlani');
            output.innerText = "Sorgulanıyor...";

            try {
                // Google'a senin anahtarınla hangi modelleri kullanabileceğini soruyoruz
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                const data = await response.json();

                if (data.models) {
                    let liste = "KULLANABİLECEĞİN MODELLER:\n\n";
                    data.models.forEach(m => {
                        // Sadece içerik üretebilenleri (generateContent destekleyenleri) ayıklayalım
                        if(m.supportedGenerationMethods.includes("generateContent")) {
                            liste += `✅ ${m.name.split('/').pop()} \n`;
                        }
                    });
                    output.innerText = liste + "\n\nBu isimlerden birini koduna yazarsan çalışacaktır.";
                } else {
                    output.innerText = "HATA: " + JSON.stringify(data.error);
                }
            } catch (err) {
                output.innerText = "Bağlantı hatası: " + err.message;
            }
        }
    </script>
</body>
</html>
