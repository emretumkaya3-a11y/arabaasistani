<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yol Arkadaşım | Arıza Destek</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <h2 class="text-2xl font-bold text-orange-500 mb-4 text-center">🚗 Yol Arkadaşım</h2>

        <div class="mb-4">
            <input type="text" id="soruKutusu" placeholder="Aracınızdaki sorunu buraya yazın..."
                   class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 outline-none text-white focus:ring-2 focus:ring-orange-500">
        </div>

        <button id="gonderBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg transition duration-200">
            SORUYU GÖNDER
        </button>

        <div id="cevapAlani" class="mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700 min-h-[100px] text-sm leading-relaxed whitespace-pre-wrap">
            <span class="text-slate-500 italic">Cevap burada görünecek...</span>
        </div>
    </div>

    <script>
        const btn = document.getElementById('gonderBtn');
        const input = document.getElementById('soruKutusu');
        const output = document.getElementById('cevapAlani');

        btn.addEventListener('click', async () => {

            // BURAYA YENİ API KEY'İNİ YAPIŞTIR
            const API_KEY = "AIzaSyA8Ml0mVJGS5sQio4VBjKMiuUVAFhzyWT8";

            const soru = input.value.trim();

            if (!soru) return;

            output.innerHTML =
                "<span class='text-orange-400 animate-pulse'>Yapay zekâ düşünüyor...</span>";

            btn.disabled = true;

            try {

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            contents: [
                                {
                                    parts: [
                                        {
                                            text: `Sen bir oto arıza uzmanısın. Kullanıcının araç sorununa kısa, anlaşılır ve yardımcı cevap ver.\n\nSoru: ${soru}`
                                        }
                                    ]
                                }
                            ]
                        })
                    }
                );

                const data = await response.json();

                console.log(data);

                if (data.error) {

                    output.innerHTML =
                        `<span class='text-red-500'>Hata: ${data.error.message}</span>`;

                } else if (
                    data.candidates &&
                    data.candidates[0] &&
                    data.candidates[0].content &&
                    data.candidates[0].content.parts[0]
                ) {

                    output.innerText =
                        data.candidates[0].content.parts[0].text;

                } else {

                    output.innerHTML =
                        "<span class='text-red-500'>Beklenmeyen cevap geldi.</span>";
                }

            } catch (err) {

                output.innerHTML =
                    "<span class='text-red-500'>Bağlantı başarısız.</span>";

                console.error(err);

            } finally {

                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
