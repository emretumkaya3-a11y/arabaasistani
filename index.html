<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yol Arkadaşım | Arıza Destek</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <h2 class="text-2xl font-bold text-orange-500 mb-4 text-center">🚗 Yol Arkadaşım</h2>
        
        <div class="mb-4">
            <label for="soruKutusu" class="block text-sm font-medium mb-2 text-slate-400">Aracınızdaki sorunu yazın:</label>
            <input type="text" id="soruKutusu" placeholder="Örn: Corsa 1.2T tekleme sorunu..." 
                   class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 outline-none text-white focus:ring-2 focus:ring-orange-500">
        </div>

        <!-- Butondan onclick'i kaldırdık, kodun içinden dinleyeceğiz -->
        <button id="gonderBtn"
                class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg transition duration-200">
            SORUYU GÖNDER
        </button>

        <div id="cevapAlani" class="mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700 min-h-[100px] text-sm leading-relaxed whitespace-pre-wrap">
            <span id="durumMesaji" class="text-slate-500 italic">Cevap burada görünecek...</span>
        </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <script type="module">
      import { GoogleGenerativeAI } from "@google/generative-ai";

      // Butonu ve giriş alanını seçiyoruz
      const btn = document.getElementById('gonderBtn');
      const input = document.getElementById('soruKutusu');
      const output = document.getElementById('cevapAlani');

      // Butona tıklanma olayını burada tanımlıyoruz
      btn.addEventListener('click', async () => {
          const API_KEY = "AIzaSyDtAN-lmb4ZGz3XmFEXOBlKBUMXBUS6jWk"; 
          const soru = input.value.trim();

          if (!soru) return;

          output.innerHTML = "<span class='text-orange-400 animate-pulse'>Yapay zeka analiz ediyor...</span>";
          btn.disabled = true;
          btn.innerText = "DÜŞÜNÜYOR...";

          try {
              const genAI = new GoogleGenerativeAI(API_KEY);
              // "gemini-1.5-flash" en güncel ve hızlı modeldir
              const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

              const result = await model.generateContent(soru);
              const response = await result.response;
              output.innerText = response.text();
              output.classList.add("text-white");
          } catch (err) {
              console.error(err);
              output.innerHTML = `<span class='text-red-500 font-bold'>Hata Oluştu!</span><br><small class='text-gray-500'>${err.message}</small>`;
          } finally {
              btn.disabled = false;
              btn.innerText = "SORUYU GÖNDER";
          }
      });
    </script>
</body>
</html>
